planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: false
      tolerance: 0.0
      allow_unknown: false
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: bench_base
      update_frequency: 5.0
      robot_radius: 0.01
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
