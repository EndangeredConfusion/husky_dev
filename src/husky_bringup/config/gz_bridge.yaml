# Gazebo -> ROS for the extra sensors (sim only). Topics must match husky_extras.urdf.xacro.
- ros_topic_name: /a200_0000/sensors/lidar2d_0/scan
  gz_topic_name: /a200_0000/sensors/lidar2d_0/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /a200_0000/sensors/gps_0/fix
  gz_topic_name: /a200_0000/sensors/gps_0/fix
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS
- ros_topic_name: /a200_0000/sensors/gps_1/fix
  gz_topic_name: /a200_0000/sensors/gps_1/fix
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS
- ros_topic_name: /a200_0000/sensors/camera_0/image
  gz_topic_name: /a200_0000/sensors/zed_sim/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /a200_0000/sensors/camera_0/depth_image
  gz_topic_name: /a200_0000/sensors/zed_sim/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /a200_0000/sensors/camera_0/points
  gz_topic_name: /a200_0000/sensors/zed_sim/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /a200_0000/sensors/camera_0/camera_info
  gz_topic_name: /a200_0000/sensors/zed_sim/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
